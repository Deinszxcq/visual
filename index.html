<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programación Visual</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: white;
    }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-text {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: #38bdf8;
      filter: blur(80px);
      opacity: 0.2;
      z-index: -1;
    }
  </style>
</head>

<body class="overflow-x-hidden relative">

  <!-- blobs decorativos -->
  <div class="blob top-0 left-0"></div>
  <div class="blob bottom-0 right-0" style="background:#818cf8;"></div>

  <!-- CONTENEDOR CENTRADO -->
  <main class="min-h-screen flex items-center justify-center px-6 py-14">
    <div class="w-full max-w-5xl">

      <!-- HERO -->
      <section class="text-center glass rounded-3xl p-10 md:p-14 mb-10">
        <div class="flex flex-col items-center gap-5">

          <span class="bg-sky-500/10 text-sky-400 px-4 py-1 rounded-full text-sm font-medium">
            Josué Jacome
          </span>

          <h1 class="text-4xl md:text-6xl font-bold leading-tight">
            Programación <span class="gradient-text">Visual</span>
          </h1>

        </div>
      </section>

      <!-- PANEL DE ACTIVIDADES -->
      <section id="panel">
        <div class="text-center mb-8">
          <h2 class="text-2xl md:text-3xl font-bold">Panel de Actividades</h2>
          <p class="text-gray-400 mt-2">
            Selecciona una sección para ingresar.
          </p>
        </div>

        <div class="grid md:grid-cols-3 gap-6">

          <!-- DEBERES -->
          <div class="glass p-6 rounded-3xl hover:border-sky-500/50 transition">
            <h3 class="text-xl font-bold mb-2">Deberes</h3>
            <p class="text-gray-400 text-sm mb-5">
              Actividades asignadas.
            </p>

            <div class="grid gap-3">
              <a href="pages/deber1.html" class="glass px-5 py-3 rounded-xl font-bold hover:bg-white/5 transition text-center">Deber 1</a>
              <a href="pages/deber2.html" class="glass px-5 py-3 rounded-xl font-bold hover:bg-white/5 transition text-center">Deber 2</a>
              <a href="pages/deber3.html" class="glass px-5 py-3 rounded-xl font-bold hover:bg-white/5 transition text-center">Deber 3</a>
            </div>
          </div>

          <!-- LECCIONES -->
          <div class="glass p-6 rounded-3xl hover:border-indigo-500/50 transition">
            <h3 class="text-xl font-bold mb-2">Lecciones</h3>
            <p class="text-gray-400 text-sm mb-5">
              Material de estudio.
            </p>

            <div class="grid gap-3">
              <a href="pages/leccion1.html" class="glass px-5 py-3 rounded-xl font-bold hover:bg-white/5 transition text-center">Lección 1</a>
              <a href="pages/leccion2.html" class="glass px-5 py-3 rounded-xl font-bold hover:bg-white/5 transition text-center">Lección 2</a>
            </div>
          </div>

          <!-- EXAMEN -->
          <div class="glass p-6 rounded-3xl hover:border-emerald-500/50 transition">
            <h3 class="text-xl font-bold mb-2">Evaluación</h3>
            <p class="text-gray-400 text-sm mb-5">
              Evaluación final del curso.
            </p>

            <a href="pages/examen-final.html"
               class="bg-emerald-500 hover:bg-emerald-600 px-6 py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-500/20 block text-center">
              Examen Final
            </a>
          </div>

        </div>
      </section>

    </div>
  </main>

</body>
</html>
