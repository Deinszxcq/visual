<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprobante de Venta de la App</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.2rem;
      color: #38bdf8;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    .card h2 {
      margin-top: 0;
      color: #22c55e;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .image-box {
      text-align: center;
      margin-top: 20px;
    }

    .image-box img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Comprobante de Venta de la Aplicación</h1>

    <div class="card">
      <h2>Reunión de Validación de Venta</h2>
      <p>
        Grabación de la reunión donde se evidencia la presentación y validación
        de la venta de la aplicación desarrollada.
      </p>
      <div style="margin-top:15px;">
        <iframe src="https://drive.google.com/file/d/1s-xdteLxeoJY61-PgDuQRGoBdClDxwWO/preview" 
                width="100%" height="480" allow="autoplay" 
                style="border:none; border-radius:12px;">
        </iframe>
      </div>
    </div>

    <div class="card">
      <h2>Comprobante de Pago</h2>
      <p>
        Evidencia del comprobante de pago correspondiente a la venta de la aplicación.
      </p>

      <div class="image-box">
        <img src="imagenes/Comprobante.png" alt="Comprobante de pago" />
      </div>
    </div>
  </div>
</body>
</html>
